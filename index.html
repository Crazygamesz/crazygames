<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceWave | Ultimate Edition</title>
  <style>
    /* UI Design & Glassmorphism */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #050814; color: #fff; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }
    
    /* Background Stars CSS */
    .space-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at bottom, #1b2735 0%, #090a0f 100%); }
    
    .view { display: none; width: 100%; max-width: 800px; padding: 20px; z-index: 10; flex-direction: column; align-items: center; }
    .view.active { display: flex; animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .glass-panel {
      background: rgba(20, 25, 45, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,210,255,0.1);
      text-align: center;
    }

    h1, h2 { background: -webkit-linear-gradient(#00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
    
    input { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(0,210,255,0.3); border-radius: 8px; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
    input:focus { border-color: #00d2ff; box-shadow: 0 0 10px rgba(0,210,255,0.3); }

    button { width: 100%; padding: 14px; margin-bottom: 10px; background: linear-gradient(90deg, #00d2ff, #3a7bd5); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
    button:hover { opacity: 0.9; transform: scale(0.98); box-shadow: 0 0 15px rgba(0,210,255,0.4); }
    button.secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
    button.danger { background: rgba(255, 50, 50, 0.2); border: 1px solid #ff4d4d; color: #ff4d4d; }
    button.danger:hover { background: #ff4d4d; color: #fff; }

    /* Admin Table */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
    th, td { border: 1px solid rgba(0,210,255,0.2); padding: 12px; text-align: left; }
    th { background: rgba(0,210,255,0.1); color: #00d2ff; }
    
    .broadcast-box { background: rgba(255, 200, 0, 0.1); border: 1px solid #ffc800; color: #ffc800; padding: 10px; border-radius: 8px; margin-bottom: 20px; width: 100%; }

    /* Game UI */
    #game-view { max-width: 100%; padding: 0; justify-content: center; align-items: center; }
    canvas { background: transparent; display: block; box-shadow: inset 0 0 50px #000; }
    #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 20; pointer-events: none; }
    #hud div { font-size: 24px; font-weight: bold; color: #00d2ff; text-shadow: 0 0 10px #00d2ff; }
    #quit-btn { position: absolute; bottom: 20px; right: 20px; width: auto; padding: 10px 30px; pointer-events: all; z-index: 20; }
  </style>
</head>
<body>

  <div class="space-bg"></div>

  <!-- AUTHENTICATION VIEW -->
  <div id="auth-view" class="view active">
    <div class="glass-panel">
      <h1>SpaceWave</h1>
      <input type="email" id="email" placeholder="Email Address">
      <input type="password" id="password" placeholder="Password">
      <button id="login-btn">Log In</button>
      <button id="signup-btn" class="secondary">Sign Up</button>
      <div id="auth-error" style="color: #ff4d4d; margin-top: 10px; font-size: 14px;"></div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="view">
    <div class="glass-panel">
      <h2>Transmission Array</h2>
      <div id="global-announcement" class="broadcast-box" style="display: none;"></div>
      
      <p style="margin-bottom: 20px; font-size: 18px;">Pilot: <strong id="user-email" style="color:#00d2ff;"></strong></p>
      <p style="margin-bottom: 30px; font-size: 18px;">High Score: <strong id="user-score" style="color:#00d2ff;"></strong></p>

      <button id="play-btn">Launch SpaceWave</button>
      <button id="admin-btn" style="display: none; background: #9b59b6;">Open Admin Panel</button>
      <button id="logout-btn" class="secondary">Disconnect (Logout)</button>
    </div>
  </div>

  <!-- ADMIN PANEL VIEW -->
  <div id="admin-view" class="view">
    <div class="glass-panel" style="max-width: 1000px;">
      <h2 style="color: #9b59b6;">Command Center (Admin)</h2>
      
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="text" id="broadcast-input" placeholder="Enter global announcement...">
        <button id="broadcast-btn" style="width: auto;">Broadcast</button>
      </div>

      <div style="overflow-x: auto;">
        <table id="users-table">
          <thead>
            <tr>
              <th>Email</th>
              <th>Score</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
      <button id="admin-back-btn" class="secondary" style="margin-top: 20px;">Back to Dashboard</button>
    </div>
  </div>

  <!-- GAME VIEW -->
  <div id="game-view" class="view">
    <div id="hud">
      <div>SCORE: <span id="score-display">0</span></div>
      <div>HULL: <span id="hp-display">100</span>%</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <button id="quit-btn" class="danger">Abort Mission</button>
  </div>

  <!-- MAIN SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- 1. FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyDZt9nls66xzPoWRsykXYE-mzeyyOrl4gg",
      authDomain: "spacewave-101e8.firebaseapp.com",
      projectId: "spacewave-101e8",
      storageBucket: "spacewave-101e8.firebasestorage.app",
      messagingSenderId: "457788800101",
      appId: "1:457788800101:web:ec6b22ad8dc2480dfb1a8c",
      measurementId: "G-BQRZ1XB5Z3",
      databaseURL: "https://spacewave-101e8-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    // --- 2. GLOBAL STATE ---
    let currentUser = null;
    let userData = null;

    // View Navigation
    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // --- 3. AUTHENTICATION & DATABASE LOGIC ---
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const snapshot = await get(ref(database, `users/${user.uid}`));
        
        if (snapshot.exists()) {
          userData = snapshot.val();
          if (userData.isBanned) {
            alert("SECURITY ALERT: Your pilot license has been permanently revoked (Banned).");
            signOut(auth);
            return;
          }
        } else {
          // New User Setup in Database
          userData = { email: user.email, score: 0, role: 'player', isBanned: false };
          await set(ref(database, `users/${user.uid}`), userData);
        }
        
        setupDashboard();
        showView('dashboard-view');
      } else {
        currentUser = null;
        userData = null;
        showView('auth-view');
      }
    });

    // Login/Signup Buttons
    document.getElementById('login-btn').addEventListener('click', () => {
      const e = document.getElementById('email').value, p = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, e, p).catch(err => document.getElementById('auth-error').innerText = err.message);
    });
    document.getElementById('signup-btn').addEventListener('click', () => {
      const e = document.getElementById('email').value, p = document.getElementById('password').value;
      createUserWithEmailAndPassword(auth, e, p).catch(err => document.getElementById('auth-error').innerText = err.message);
    });
    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    // --- 4. DASHBOARD & ADMIN SYSTEMS ---
    function setupDashboard() {
      document.getElementById('user-email').innerText = userData.email;
      document.getElementById('user-score').innerText = userData.score;
      document.getElementById('admin-btn').style.display = (userData.role === 'admin') ? 'block' : 'none';
    }

    // Listen to Global Announcements
    onValue(ref(database, 'global/announcement'), (snapshot) => {
      const msg = snapshot.val();
      const box = document.getElementById('global-announcement');
      if (msg) { box.innerText = "ADMIN BROADCAST: " + msg; box.style.display = 'block'; }
    });

    // Admin Panel Routing
    document.getElementById('admin-btn').addEventListener('click', () => {
      showView('admin-view');
      onValue(ref(database, 'users'), (snapshot) => {
        const tbody = document.getElementById('users-tbody');
        tbody.innerHTML = '';
        snapshot.forEach(child => {
          const uid = child.key; const data = child.val();
          tbody.innerHTML += `
            <tr>
              <td>${data.email}</td>
              <td>${data.score}</td>
              <td>${data.role}</td>
              <td style="color:${data.isBanned ? '#ff4d4d' : '#00d2ff'}">${data.isBanned ? 'BANNED' : 'ACTIVE'}</td>
              <td>
                <button class="${data.isBanned ? '' : 'danger'}" onclick="window.toggleBan('${uid}', ${data.isBanned})" style="padding: 5px; font-size:12px; width: auto;">${data.isBanned ? 'Unban' : 'Ban'}</button>
                ${data.role !== 'admin' ? `<button onclick="window.makeAdmin('${uid}')" style="padding: 5px; font-size:12px; width: auto;">Promote</button>` : ''}
              </td>
            </tr>`;
        });
      });
    });

    document.getElementById('broadcast-btn').addEventListener('click', () => {
      const msg = document.getElementById('broadcast-input').value;
      set(ref(database, 'global/announcement'), msg);
      document.getElementById('broadcast-input').value = '';
    });
    document.getElementById('admin-back-btn').addEventListener('click', () => showView('dashboard-view'));

    // Global Window functions so inline HTML buttons can access them
    window.toggleBan = (uid, current) => update(ref(database, `users/${uid}`), { isBanned: !current });
    window.makeAdmin = (uid) => update(ref(database, `users/${uid}`), { role: 'admin' });


    // --- 5. THE SPACEWAVE GAME ENGINE ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let gameLoopId;
    let isPlaying = false;
    
    // Game State
    let player, bullets, enemies, particles, score, keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    class Player {
      constructor() { this.w = 40; this.h = 40; this.x = canvas.width/2 - 20; this.y = canvas.height - 80; this.speed = 7; this.hp = 100; this.cooldown = 0; }
      update() {
        if ((keys['ArrowLeft'] || keys['a']) && this.x > 0) this.x -= this.speed;
        if ((keys['ArrowRight'] || keys['d']) && this.x < canvas.width - this.w) this.x += this.speed;
        if ((keys['ArrowUp'] || keys['w']) && this.y > 0) this.y -= this.speed;
        if ((keys['ArrowDown'] || keys['s']) && this.y < canvas.height - this.h) this.y += this.speed;
        
        if (keys[' '] && this.cooldown <= 0) {
          bullets.push(new Bullet(this.x + this.w/2, this.y));
          this.cooldown = 15;
        }
        if (this.cooldown > 0) this.cooldown--;
      }
      draw() {
        ctx.fillStyle = '#00d2ff';
        ctx.shadowBlur = 15; ctx.shadowColor = '#00d2ff';
        ctx.beginPath(); ctx.moveTo(this.x + this.w/2, this.y); ctx.lineTo(this.x + this.w, this.y + this.h); ctx.lineTo(this.x, this.y + this.h); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    class Bullet {
      constructor(x, y) { this.x = x - 2; this.y = y; this.w = 4; this.h = 15; this.speed = 10; this.active = true; }
      update() { this.y -= this.speed; if (this.y < 0) this.active = false; }
      draw() { ctx.fillStyle = '#ff00ff'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff00ff'; ctx.fillRect(this.x, this.y, this.w, this.h); ctx.shadowBlur = 0; }
    }

    class Enemy {
      constructor() { this.w = 30; this.h = 30; this.x = Math.random() * (canvas.width - this.w); this.y = -50; this.speed = Math.random() * 2 + 2; this.active = true; }
      update() { this.y += this.speed; if (this.y > canvas.height) this.active = false; }
      draw() { ctx.fillStyle = '#ff4d4d'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff4d4d'; ctx.fillRect(this.x, this.y, this.w, this.h); ctx.shadowBlur = 0; }
    }

    class Particle {
      constructor(x, y) { this.x = x; this.y = y; this.vx = (Math.random() - 0.5) * 8; this.vy = (Math.random() - 0.5) * 8; this.life = 1.0; }
      update() { this.x += this.vx; this.y += this.vy; this.life -= 0.05; }
      draw() { ctx.fillStyle = `rgba(255, 200, 0, ${this.life})`; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill(); }
    }

    function checkCollisions() {
      bullets.forEach(b => {
        enemies.forEach(e => {
          if (b.active && e.active && b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.h + b.y > e.y) {
            b.active = false; e.active = false; score += 10;
            for(let i=0; i<10; i++) particles.push(new Particle(e.x + e.w/2, e.y + e.h/2));
          }
        });
      });
      enemies.forEach(e => {
        if (e.active && player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.h + player.y > e.y) {
          e.active = false; player.hp -= 20;
          for(let i=0; i<20; i++) particles.push(new Particle(player.x + player.w/2, player.y + player.h/2));
        }
      });
    }

    async function gameOver() {
      isPlaying = false;
      if (score > userData.score) {
        await update(ref(database, `users/${currentUser.uid}`), { score: score });
        userData.score = score;
      }
      setupDashboard();
      showView('dashboard-view');
    }

    function loop() {
      if (!isPlaying) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      player.update(); player.draw();
      
      if (Math.random() < 0.05) enemies.push(new Enemy());

      [bullets, enemies, particles].forEach(arr => {
        for (let i = arr.length - 1; i >= 0; i--) {
          arr[i].update(); arr[i].draw();
          if (arr[i].active === false || arr[i].life <= 0) arr.splice(i, 1);
        }
      });

      checkCollisions();
      
      document.getElementById('score-display').innerText = score;
      document.getElementById('hp-display').innerText = player.hp;
      if (player.hp <= 0) gameOver();
      
      requestAnimationFrame(loop);
    }

    // Launch Game
    document.getElementById('play-btn').addEventListener('click', () => {
      showView('game-view');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      player = new Player(); bullets = []; enemies = []; particles = []; score = 0; isPlaying = true;
      loop();
    });

    // Abort Mission
    document.getElementById('quit-btn').addEventListener('click', () => { player.hp = 0; });
    
    // Handle Window Resize dynamically for Canvas
    window.addEventListener('resize', () => { if(isPlaying){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }});
  </script>
</body>
</html>
