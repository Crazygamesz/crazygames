<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Arcade | Space Waves</title>
  <style>
    :root {
      --bg-main: #0c0d14;
      --bg-panel: #161824;
      --bg-hover: #232738;
      --accent: #7c5cff;
      --accent-neon: #00ffcc;
      --text-main: #f0f2f5;
      --text-muted: #8a8f9d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar Navigation */
    .sidebar { width: 240px; background: var(--bg-panel); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid #222536; flex-shrink: 0; }
    .brand { font-size: 22px; font-weight: 900; color: var(--accent-neon); letter-spacing: 1px; margin-bottom: 30px; display: flex; align-items: center; gap: 8px; }
    .nav-category { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 15px 0 8px 10px; letter-spacing: 1px; }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); padding: 12px 14px; border-radius: 8px; font-weight: 600; text-align: left; cursor: pointer; transition: 0.2s; width: 100%; display: flex; align-items: center; gap: 10px; }
    .nav-btn:hover, .nav-btn.active { background: var(--bg-hover); color: #fff; }
    .nav-btn.active { border-left: 3px solid var(--accent); }

    /* Main Section */
    .main-area { flex-grow: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 25px; }
    
    /* Top Bar */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 20px; }
    .search-input { background: var(--bg-panel); border: 1px solid #272a3d; border-radius: 20px; padding: 10px 20px; color: #fff; width: 300px; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .stats-badge { background: var(--bg-panel); border: 1px solid #272a3d; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; color: var(--accent-neon); }

    /* Game Grid */
    .section-title { font-size: 18px; margin-bottom: 15px; font-weight: 700; }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    
    .game-card { background: var(--bg-panel); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1); position: relative; border: 1px solid #202334; }
    .game-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 8px 20px rgba(124, 92, 255, 0.2); }
    .game-card .thumb-box { height: 130px; background: #1a1d2e; display: flex; align-items: center; justify-content: center; font-size: 40px; position: relative; }
    .game-card .info { padding: 12px; }
    .game-card h4 { font-size: 15px; margin-bottom: 4px; }
    .game-card p { font-size: 12px; color: var(--text-muted); }

    /* Modal / Canvas Overlay */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(8, 9, 14, 0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; }
    .modal-header { width: 800px; max-width: 95%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .close-btn { background: #ff4757; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    #gameCanvas { background: #000; border: 2px solid var(--accent); border-radius: 10px; box-shadow: 0 0 30px rgba(124, 92, 255, 0.3); width: 800px; height: 450px; max-width: 95%; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">⚡ PULSE ARCADE</div>
    
    <div class="nav-category">Navigation</div>
    <button class="nav-btn active" onclick="filterGames('all')">🎮 All Games</button>
    <button class="nav-btn" onclick="filterGames('rhythm')">🌊 Rhythm & Waves</button>
    <button class="nav-btn" onclick="filterGames('arcade')">👾 Arcade</button>

    <div class="nav-category">Saved Data</div>
    <button class="nav-btn" onclick="showSavedStats()">💾 My High Scores</button>
  </aside>

  <!-- Main View -->
  <main class="main-area">
    <div class="topbar">
      <input type="text" class="search-input" placeholder="Search games..." onkeyup="searchGames(this.value)">
      <div class="stats-badge" id="globalBest">Space Waves High Score: 0</div>
    </div>

    <h3 class="section-title">Trending Games</h3>
    <div class="game-grid" id="gameGrid">
      <!-- Embedded Space Waves Game -->
      <div class="game-card" data-category="rhythm" onclick="launchSpaceWaves()">
        <div class="thumb-box" style="background: linear-gradient(135deg, #7c5cff, #00ffcc);">🌊</div>
        <div class="info">
          <h4>Space Waves</h4>
          <p>Tap/Hold to wave dodge!</p>
        </div>
      </div>

      <!-- External/Placeholder Game Slots -->
      <div class="game-card" data-category="arcade" onclick="alert('Add custom iframe game here!')">
        <div class="thumb-box" style="background: linear-gradient(135deg, #ff4757, #ffa502);">🚀</div>
        <div class="info">
          <h4>Cosmic Runner</h4>
          <p>Arcade Runner</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Space Waves Game Modal -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-header">
      <h2 id="gameTitle">Space Waves</h2>
      <button class="close-btn" onclick="closeGameModal()">✖ Exit Game</button>
    </div>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
  </div>

  <script>
    /* ==========================================
       1. AUTO-SAVE & LOCALSTORAGE ENGINE
       ========================================== */
    const AutoSave = {
      getScore(gameKey) {
        return parseInt(localStorage.getItem(`arcade_${gameKey}_score`)) || 0;
      },
      saveScore(gameKey, score) {
        const currentBest = this.getScore(gameKey);
        if (score > currentBest) {
          localStorage.setItem(`arcade_${gameKey}_score`, score);
          return true; // New High Score!
        }
        return false;
      }
    };

    // Update Topbar Highscore Display
    function updateStatsUI() {
      const bestScore = AutoSave.getScore('spacewaves');
      document.getElementById('globalBest').innerText = `Space Waves High Score: ${bestScore}`;
    }
    updateStatsUI();

    function showSavedStats() {
      const score = AutoSave.getScore('spacewaves');
      alert(` Your Auto-Saved Statistics:\n\nSpace Waves Best Distance: ${score}m`);
    }

    /* ==========================================
       2. SPACE WAVES GAME ENGINE (CANVAS)
       ========================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let animationId;
    let isHolding = false;
    let gameOver = false;
    let score = 0;

    // Player State
    const player = { x: 100, y: 225, size: 12, vy: 0, angle: 0 };
    let obstacles = [];
    let frame = 0;

    // Input Events
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') isHolding = true; });
    window.addEventListener('keyup', (e) => { if (e.code === 'Space') isHolding = false; });
    canvas.addEventListener('mousedown', () => isHolding = true);
    canvas.addEventListener('mouseup', () => isHolding = false);

    function launchSpaceWaves() {
      document.getElementById('gameModal').style.display = 'flex';
      resetSpaceWaves();
      gameLoop();
    }

    function resetSpaceWaves() {
      player.y = 225;
      player.vy = 0;
      obstacles = [];
      score = 0;
      frame = 0;
      gameOver = false;
    }

    function closeGameModal() {
      document.getElementById('gameModal').style.display = 'none';
      cancelAnimationFrame(animationId);
      updateStatsUI();
    }

    function gameLoop() {
      if (gameOver) {
        const isNewBest = AutoSave.saveScore('spacewaves', Math.floor(score));
        updateStatsUI();

        // Game Over Screen
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CRASHED!', canvas.width / 2, 180);
        
        ctx.font = '20px Inter, sans-serif';
        ctx.fillText(`Distance: ${Math.floor(score)}m`, canvas.width / 2, 220);
        
        if (isNewBest) {
          ctx.fillStyle = '#00ffcc';
          ctx.fillText('NEW HIGH SCORE SAVED!', canvas.width / 2, 260);
        }

        ctx.fillStyle = '#7c5cff';
        ctx.fillText('Click or Press Space to Restart', canvas.width / 2, 310);
        return;
      }

      // Logic Updates
      frame++;
      score += 0.1;

      // Space Waves Movement Logic (Diagonal Wave motion)
      if (isHolding) {
        player.vy = -6; // Move diagonal UP
        player.angle = -Math.PI / 4;
      } else {
        player.vy = 6;  // Move diagonal DOWN
        player.angle = Math.PI / 4;
      }
      player.y += player.vy;

      // Boundary Collisions
      if (player.y <= 0 || player.y >= canvas.height) {
        gameOver = true;
      }

      // Generate Obstacles (Spikes / Blocks)
      if (frame % 60 === 0) {
        const gapHeight = 140;
        const topHeight = Math.random() * (canvas.height - gapHeight - 60) + 30;
        obstacles.push({
          x: canvas.width,
          top: topHeight,
          bottom: canvas.height - topHeight - gapHeight,
          width: 40
        });
      }

      // Move and Collision Check Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= 5;

        // Collision Check (AABB)
        if (player.x + player.size > obs.x && player.x - player.size < obs.x + obs.width) {
          if (player.y - player.size < obs.top || player.y + player.size > canvas.height - obs.bottom) {
            gameOver = true;
          }
        }

        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
      }

      // Rendering
      ctx.fillStyle = '#0c0d14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines (Cyberpunk Background effect)
      ctx.strokeStyle = '#161824';
      ctx.lineWidth = 1;
      for (let x = (frame * -2) % 40; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      // Draw Obstacles
      ctx.fillStyle = '#ff4757';
      obstacles.forEach(obs => {
        ctx.fillRect(obs.x, 0, obs.width, obs.top);
        ctx.fillRect(obs.x, canvas.height - obs.bottom, obs.width, obs.bottom);
      });

      // Draw Player Arrow Wave
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      ctx.fillStyle = '#00ffcc';
      ctx.beginPath();
      ctx.moveTo(12, 0); ctx.lineTo(-10, -8); ctx.lineTo(-6, 0); ctx.lineTo(-10, 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // UI Overlay
      ctx.fillStyle = '#fff';
      ctx.font = '16px Inter, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`Distance: ${Math.floor(score)}m`, 20, 30);

      animationId = requestAnimationFrame(gameLoop);
    }

    // Restart game on click after game over
    canvas.addEventListener('click', () => {
      if (gameOver) {
        resetSpaceWaves();
        gameLoop();
      }
    });

    /* ==========================================
       3. SEARCH AND FILTER FUNCTIONALITY
       ========================================== */
    function filterGames(category) {
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => {
        if (category === 'all' || card.dataset.category === category) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function searchGames(query) {
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => {
        const title = card.querySelector('h4').innerText.toLowerCase();
        card.style.display = title.includes(query.toLowerCase()) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
