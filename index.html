<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Waves | Ultimate Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #050814; color: #fff; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }
    
    .space-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(circle at bottom, #1b2735 0%, #090a0f 100%); }
    
    .view { display: none; width: 100%; max-width: 900px; padding: 20px; z-index: 10; flex-direction: column; align-items: center; }
    .view.active { display: flex; animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .login-container, .glass-panel {
      background: rgba(20, 25, 45, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 16px;
      padding: 30px; width: 100%; box-shadow: 0 15px 35px rgba(0,210,255,0.1); text-align: center;
    }
    .login-container { max-width: 400px; }

    h2, h3 { 
      background: -webkit-linear-gradient(#00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
      margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; 
    }

    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group input, .input-group select {
      width: 100%; padding: 12px 15px; background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px;
      color: #fff; font-size: 16px; outline: none; transition: border-color 0.3s;
    }
    .input-group input:focus, .input-group select:focus { border-color: #00d2ff; }

    button {
      width: 100%; padding: 12px; margin-bottom: 10px;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5); border: none; border-radius: 8px;
      color: white; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;
    }
    button:hover { opacity: 0.9; transform: scale(0.98); box-shadow: 0 0 15px rgba(0,210,255,0.4); }
    button.secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
    button.danger { background: rgba(255, 50, 50, 0.2); border: 1px solid #ff4d4d; color: #ff4d4d; }
    button.danger:hover { background: #ff4d4d; color: #fff; }
    button.admin-btn-theme { background: linear-gradient(90deg, #8e44ad, #9b59b6); }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { border: 1px solid rgba(0,210,255,0.2); padding: 10px; text-align: left; }
    th { background: rgba(0,210,255,0.1); color: #00d2ff; }
    
    .broadcast-box { background: rgba(255, 200, 0, 0.1); border: 1px solid #ffc800; color: #ffc800; padding: 10px; border-radius: 8px; margin-bottom: 15px; width: 100%; font-size: 14px; }
    
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-bottom: 20px; }
    .admin-card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid rgba(155, 89, 182, 0.3); }

    #game-view { max-width: 100%; padding: 0; justify-content: center; align-items: center; }
    canvas { background: transparent; display: block; box-shadow: inset 0 0 50px #000; }
    #hud { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 20; pointer-events: none; }
    #hud div { font-size: 24px; font-weight: bold; color: #00d2ff; text-shadow: 0 0 10px #00d2ff; }
    #quit-btn { position: absolute; bottom: 20px; right: 20px; width: auto; padding: 10px 30px; pointer-events: all; z-index: 20; }
  </style>
</head>
<body>

  <div class="space-bg"></div>

  <!-- AUTHENTICATION VIEW -->
  <div id="auth-view" class="view active">
    <div class="login-container">
      <h2>Space Waves</h2>
      <div id="maintenance-notice" class="broadcast-box" style="display:none; background:rgba(255,0,0,0.1); border-color:#ff4d4d; color:#ff4d4d;">System is currently under maintenance. Only Admins can log in.</div>
      <div class="input-group">
        <input type="text" id="username" placeholder="Username" required autocomplete="username">
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      </div>
      <button id="login-btn">Initialize Launch (Log In)</button>
      <button id="signup-btn" class="secondary">Create Account</button>
      <div id="auth-error" style="color: #ff4d4d; margin-top: 15px; font-size: 14px; font-weight: bold;"></div>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="view">
    <div class="glass-panel" style="max-width: 500px;">
      <h3>Transmission Array</h3>
      <div id="global-announcement" class="broadcast-box" style="display: none;"></div>
      
      <p style="margin-bottom: 15px; font-size: 18px;">Pilot: <strong id="user-display-name" style="color:#00d2ff;"></strong></p>
      <p style="margin-bottom: 25px; font-size: 18px;">Distance Record: <strong id="user-score" style="color:#00d2ff;"></strong>m</p>

      <button id="play-btn">Launch Wave Flight</button>
      <button id="admin-btn" class="admin-btn-theme" style="display: none;">Open Admin Panel</button>
      <button id="logout-btn" class="secondary">Disconnect (Logout)</button>
    </div>
  </div>

  <!-- ADMIN PANEL VIEW -->
  <div id="admin-view" class="view">
    <div class="glass-panel">
      <h3 style="color: #9b59b6;">Command Center (Admin)</h3>
      
      <div class="admin-grid">
        <div class="admin-card">
          <h4 style="color:#9b59b6; margin-bottom:10px; font-size:14px;">Global Broadcast</h4>
          <input type="text" id="broadcast-input" placeholder="Enter announcement..." style="width:100%; padding:8px; margin-bottom:8px; background:rgba(0,0,0,0.4); border:1px solid rgba(155,89,182,0.3); border-radius:6px; color:#fff;">
          <button id="broadcast-btn" class="admin-btn-theme" style="margin-bottom:0; padding:8px;">Broadcast Message</button>
        </div>
        <div class="admin-card">
          <h4 style="color:#9b59b6; margin-bottom:10px; font-size:14px;">System Controls</h4>
          <button id="maintenance-toggle-btn" class="secondary" style="margin-bottom:8px; padding:8px;">Toggle Maintenance Mode</button>
          <button id="system-reboot-btn" class="danger" style="margin-bottom:0; padding:8px;">Trigger System Reboot</button>
        </div>
      </div>

      <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
        <h4 style="color: #00d2ff; font-size: 15px;">Pilot Database Management</h4>
        <span style="font-size: 12px; color: #aaa;">Syncs Live Across All Devices</span>
      </div>

      <div style="max-height: 250px; overflow-y: auto;">
        <table id="users-table">
          <thead>
            <tr>
              <th>Username</th>
              <th>Distance</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
      <button id="admin-back-btn" class="secondary" style="margin-top: 20px;">Back to Dashboard</button>
    </div>
  </div>

  <!-- GAME VIEW -->
  <div id="game-view" class="view">
    <div id="hud">
      <div>DISTANCE: <span id="score-display">0</span>m</div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <button id="quit-btn" class="danger">Abort Mission</button>
  </div>

  <!-- MAIN SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDZt9nls66xzPoWRsykXYE-mzeyyOrl4gg",
      authDomain: "spacewave-101e8.firebaseapp.com",
      projectId: "spacewave-101e8",
      storageBucket: "spacewave-101e8.firebasestorage.app",
      messagingSenderId: "457788800101",
      appId: "1:457788800101:web:ec6b22ad8dc2480dfb1a8c",
      measurementId: "G-BQRZ1XB5Z3",
      databaseURL: "https://spacewave-101e8-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let currentUserId = localStorage.getItem('spacewave_uid') || null;
    let userData = null;
    let isMaintenanceActive = false;

    // Live global listeners to sync state across all devices instantly
    onValue(ref(database, 'global/maintenance'), (snapshot) => {
      isMaintenanceActive = snapshot.val() || false;
      const notice = document.getElementById('maintenance-notice');
      if (notice) {
        notice.style.display = isMaintenanceActive ? 'block' : 'none';
      }
    });

    onValue(ref(database, 'global/announcement'), (snapshot) => {
      const msg = snapshot.val();
      const box = document.getElementById('global-announcement');
      if (box) {
        if (msg) { box.innerText = "ADMIN BROADCAST: " + msg; box.style.display = 'block'; }
        else { box.style.display = 'none'; }
      }
    });

    onValue(ref(database, 'global/rebootSignal'), () => {
      if (localStorage.getItem('spacewave_uid')) {
        alert("CRITICAL: Administrative system reboot initiated. Re-authenticating session.");
        logoutUser();
      }
    });

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    async function checkSession() {
      if (currentUserId) {
        const snap = await get(ref(database, `users/${currentUserId}`));
        if (snap.exists()) {
          userData = snap.val();
          if (userData.isBanned) {
            alert(`SECURITY ALERT: Pilot license revoked. Reason: ${userData.banReason || 'Violation of protocols'}`);
            logoutUser();
            return;
          }
          if (isMaintenanceActive && userData.role !== 'admin') {
            alert("System is currently locked under maintenance mode.");
            logoutUser();
            return;
          }
          setupDashboard();
          showView('dashboard-view');
          return;
        }
      }
      showView('auth-view');
    }

    function logoutUser() {
      localStorage.removeItem('spacewave_uid');
      currentUserId = null;
      userData = null;
      showView('auth-view');
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const errBox = document.getElementById('auth-error');
      errBox.innerText = "";

      if (!u || !p) { errBox.innerText = "Enter username and password."; return; }

      const usersSnap = await get(ref(database, 'users'));
      let foundUserKey = null;
      let foundUserData = null;

      usersSnap.forEach(child => {
        const val = child.val();
        if (val.username && val.username.toLowerCase() === u.toLowerCase()) {
          foundUserKey = child.key;
          foundUserData = val;
        }
      });

      if (!foundUserKey) { errBox.innerText = "Pilot not found. Create an account."; return; }
      if (foundUserData.password !== p) { errBox.innerText = "Incorrect password."; return; }
      if (foundUserData.isBanned) { errBox.innerText = `Account banned: ${foundUserData.banReason || 'No reason provided'}`; return; }
      
      if (isMaintenanceActive && foundUserData.role !== 'admin') {
        errBox.innerText = "Maintenance mode active. Only admins may access.";
        return;
      }

      currentUserId = foundUserKey;
      userData = foundUserData;
      localStorage.setItem('spacewave_uid', currentUserId);
      setupDashboard();
      showView('dashboard-view');
    });

    document.getElementById('signup-btn').addEventListener('click', async () => {
      if (isMaintenanceActive) {
        alert("Registrations disabled during maintenance.");
        return;
      }
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const errBox = document.getElementById('auth-error');
      errBox.innerText = "";

      if (!u || !p) { errBox.innerText = "Enter username and password."; return; }
      if (u.length < 3) { errBox.innerText = "Username must be at least 3 characters."; return; }

      const usersSnap = await get(ref(database, 'users'));
      let taken = false;
      usersSnap.forEach(child => {
        if (child.val().username && child.val().username.toLowerCase() === u.toLowerCase()) taken = true;
      });

      if (taken) { errBox.innerText = "Username already taken."; return; }

      const newUserId = 'user_' + Date.now() + Math.random().toString(36).substring(2, 7);
      const newUser = { username: u, password: p, score: 0, role: 'player', isBanned: false, banReason: '' };

      await set(ref(database, `users/${newUserId}`), newUser);
      currentUserId = newUserId;
      userData = newUser;
      localStorage.setItem('spacewave_uid', currentUserId);
      setupDashboard();
      showView('dashboard-view');
    });

    document.getElementById('logout-btn').addEventListener('click', logoutUser);

    function setupDashboard() {
      document.getElementById('user-display-name').innerText = userData?.username || "Unknown Pilot";
      document.getElementById('user-score').innerText = userData?.score || 0;
      document.getElementById('admin-btn').style.display = (userData?.role === 'admin') ? 'block' : 'none';
    }

    // --- ADMIN PANEL LOGIC ---
    document.getElementById('admin-btn').addEventListener('click', () => {
      showView('admin-view');
      onValue(ref(database, 'users'), (snapshot) => {
        const tbody = document.getElementById('users-tbody');
        tbody.innerHTML = '';
        snapshot.forEach(child => {
          const uid = child.key; const data = child.val();
          tbody.innerHTML += `
            <tr>
              <td>${data.username || 'Unknown'}</td>
              <td>${data.score || 0}m <button onclick="window.editScore('${uid}', ${data.score})" style="padding:2px 5px; font-size:10px; width:auto; margin-left:5px;">Edit</button></td>
              <td>${data.role}</td>
              <td style="color:${data.isBanned ? '#ff4d4d' : '#00d2ff'}">${data.isBanned ? 'BANNED' : 'ACTIVE'}</td>
              <td>
                <button class="${data.isBanned ? '' : 'danger'}" onclick="window.toggleBan('${uid}', ${data.isBanned})" style="padding: 4px 8px; font-size:11px; width: auto; margin-bottom:2px;">${data.isBanned ? 'Unban' : 'Ban'}</button>
                <button onclick="window.deleteUser('${uid}')" class="danger" style="padding: 4px 8px; font-size:11px; width: auto; margin-bottom:2px;">Delete</button>
                ${data.role !== 'admin' ? `<button onclick="window.makeAdmin('${uid}')" class="admin-btn-theme" style="padding: 4px 8px; font-size:11px; width: auto; margin-bottom:0;">Promote</button>` : ''}
              </td>
            </tr>`;
        });
      });
    });

    document.getElementById('broadcast-btn').addEventListener('click', () => {
      const msg = document.getElementById('broadcast-input').value;
      set(ref(database, 'global/announcement'), msg);
      document.getElementById('broadcast-input').value = '';
    });

    document.getElementById('maintenance-toggle-btn').addEventListener('click', () => {
      const newState = !isMaintenanceActive;
      set(ref(database, 'global/maintenance'), newState);
      alert(`Maintenance mode is now ${newState ? 'ENABLED' : 'DISABLED'}`);
    });

    document.getElementById('system-reboot-btn').addEventListener('click', () => {
      if (confirm("Are you sure you want to broadcast a global system reboot?")) {
        set(ref(database, 'global/rebootSignal'), Date.now());
      }
    });

    document.getElementById('admin-back-btn').addEventListener('click', () => showView('dashboard-view'));

    window.toggleBan = (uid, current) => {
      if (!current) {
        const reason = prompt("Enter custom ban reason for this pilot:", "Cheating / Exploiting");
        if (reason === null) return;
        update(ref(database, `users/${uid}`), { isBanned: true, banReason: reason });
      } else {
        update(ref(database, `users/${uid}`), { isBanned: false, banReason: '' });
      }
    };

    window.editScore = (uid, currentScore) => {
      const newScore = prompt("Enter corrected distance record:", currentScore);
      if (newScore !== null && !isNaN(newScore)) {
        update(ref(database, `users/${uid}`), { score: Number(newScore) });
      }
    };

    window.deleteUser = (uid) => {
      if (confirm("Permanently delete this user record from the database?")) {
        remove(ref(database, `users/${uid}`));
      }
    };

    window.makeAdmin = (uid) => update(ref(database, `users/${uid}`), { role: 'admin' });

    // --- SPACE WAVES GAME ENGINE (ACCURATE WAVE MECHANIC) ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let isPlaying = false;
    let player, obstacles, particles, distance, isHolding = false;

    window.addEventListener('mousedown', () => isHolding = true);
    window.addEventListener('mouseup', () => isHolding = false);
    window.addEventListener('touchstart', () => isHolding = true);
    window.addEventListener('touchend', () => isHolding = false);
    window.addEventListener('keydown', e => { if(e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') isHolding = true; });
    window.addEventListener('keyup', e => { if(e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') isHolding = false; });

    class WavePlayer {
      constructor() {
        this.x = 150;
        this.y = canvas.height / 2;
        this.size = 18;
        this.speed = 6.5; // Up/down flight speed when holding
      }
      update() {
        if (isHolding) {
          this.y -= this.speed;
        } else {
          this.y += this.speed;
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(isHolding ? -0.45 : 0.45);
        ctx.fillStyle = '#00d2ff';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00d2ff';
        ctx.beginPath();
        ctx.moveTo(this.size, 0);
        ctx.lineTo(-this.size, -this.size * 0.7);
        ctx.lineTo(-this.size * 0.5, 0);
        ctx.lineTo(-this.size, this.size * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    class ObstacleBlock {
      constructor(x, topH, botH) {
        this.x = x;
        this.w = 55;
        this.topH = topH;
        this.botH = botH;
        this.passed = false;
      }
      update(speed) {
        this.x -= speed;
      }
      draw() {
        ctx.fillStyle = '#ff4d4d';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff4d4d';
        // Top obstacle wall
        ctx.fillRect(this.x, 0, this.w, this.topH);
        // Bottom obstacle wall
        ctx.fillRect(this.x, canvas.height - this.botH, this.w, this.botH);
        ctx.shadowBlur = 0;
      }
    }

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 1) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.life = 1.0;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.04;
      }
      draw() {
        ctx.fillStyle = `rgba(0, 210, 255, ${this.life})`;
        ctx.fillRect(this.x, this.y, 4, 4);
      }
    }

    async function gameOver() {
      isPlaying = false;
      const finalDist = Math.floor(distance);
      if (finalDist > (userData.score || 0)) {
        await update(ref(database, `users/${currentUserId}`), { score: finalDist });
        userData.score = finalDist;
      }
      setupDashboard();
      showView('dashboard-view');
    }

    function loop() {
      if (!isPlaying) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Tunnel border lines
      ctx.strokeStyle = 'rgba(0, 210, 255, 0.3)';
      ctx.lineWidth = 3;
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

      distance += 0.25;
      const currentScrollSpeed = 6 + Math.min(distance / 500, 4); // Progressive speed ramp

      player.update();
      player.draw();

      // Spawn procedural wave tunnels / obstacles
      if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < canvas.width - 280) {
        const lastTop = obstacles.length > 0 ? obstacles[obstacles.length - 1].topH : canvas.height * 0.25;
        const lastBot = obstacles.length > 0 ? obstacles[obstacles.length - 1].botH : canvas.height * 0.25;
        
        let delta = (Math.random() - 0.5) * 120;
        let newTop = Math.max(50, Math.min(canvas.height * 0.55, lastTop + delta));
        let newBot = Math.max(50, Math.min(canvas.height * 0.55, lastBot - delta));
        
        // Ensure gap safety window
        if (canvas.height - newTop - newBot < 130) {
          newTop -= 35;
          newBot -= 35;
        }
        
        obstacles.push(new ObstacleBlock(canvas.width, newTop, newBot));
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.update(currentScrollSpeed);
        obs.draw();

        // Check boundaries & wall crashes
        if (player.y - 8 <= 10 || player.y + 8 >= canvas.height - 10) {
          triggerCrash();
        }

        // Check obstacle block collisions
        if (player.x + 8 > obs.x && player.x - 8 < obs.x + obs.w) {
          if (player.y - 8 < obs.topH || player.y + 8 > canvas.height - obs.botH) {
            triggerCrash();
          }
        }

        if (obs.x + obs.w < 0) {
          obstacles.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      document.getElementById('score-display').innerText = Math.floor(distance);
      requestAnimationFrame(loop);
    }

    function triggerCrash() {
      for(let i=0; i<35; i++) particles.push(new Particle(player.x, player.y));
      gameOver();
    }

    document.getElementById('play-btn').addEventListener('click', () => {
      showView('game-view');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      player = new WavePlayer();
      obstacles = [];
      particles = [];
      distance = 0;
      isPlaying = true;
      loop();
    });

    document.getElementById('quit-btn').addEventListener('click', () => { isPlaying = false; showView('dashboard-view'); setupDashboard(); });
    window.addEventListener('resize', () => { if(isPlaying){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }});

    checkSession();
  </script>
</body>
</html>
